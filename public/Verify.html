<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Certificate Verification</title>
  <style>
    :root{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f5f7f8;--card:#fff;--accent:#0f766e;--ok:#047857;--bad:#b91c1c}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{width:min(720px,100%);background:#fff;border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:0 20px 70px rgba(15,23,42,.10)}
    .hero{padding:30px 32px;color:#fff;background:linear-gradient(135deg,#10211e,#164e44)}
    .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
    .brand img,.brand-fallback{width:38px;height:38px;border-radius:11px;object-fit:contain;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18)}
    .brand-fallback{display:flex;align-items:center;justify-content:center;font-size:12px}
    .eyebrow{margin-top:28px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;opacity:.72}
    h1{margin:8px 0 8px;font-size:32px;line-height:1.1}
    .sub{margin:0;color:rgba(255,255,255,.75)}
    .body{padding:30px 32px}
    label{display:block;font-size:13px;font-weight:750;margin-bottom:8px}
    .row{display:flex;gap:10px}
    input{flex:1;min-width:0;border:1px solid #cbd5e1;border-radius:13px;padding:14px 15px;font-size:15px;outline:none}
    input:focus{border-color:#0f766e;box-shadow:0 0 0 4px rgba(15,118,110,.10)}
    button{border:0;border-radius:13px;padding:0 22px;background:#0f766e;color:#fff;font-weight:750;cursor:pointer}
    button:disabled{opacity:.55;cursor:wait}
    .hint{font-size:12px;color:var(--muted);margin-top:8px}
    .result{margin-top:24px;border:1px solid var(--line);border-radius:18px;padding:20px;display:none}
    .result.ok{border-color:#a7f3d0;background:#ecfdf5}
    .result.bad{border-color:#fecaca;background:#fef2f2}
    .status{font-size:18px;font-weight:800;margin-bottom:14px}
    .ok .status{color:var(--ok)} .bad .status{color:var(--bad)}
    dl{margin:0;display:grid;grid-template-columns:150px 1fr;gap:10px 18px;font-size:14px}
    dt{color:var(--muted)} dd{margin:0;font-weight:650;overflow-wrap:anywhere}
    .loading{display:none;margin-top:16px;color:var(--muted);font-size:13px}
    .foot{padding:18px 32px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:12px}
    .foot span:last-child{white-space:nowrap}
    @media(max-width:560px){.wrap{padding:12px}.hero,.body,.foot{padding:24px 20px}.row{flex-direction:column}button{height:48px}dl{grid-template-columns:1fr;gap:3px}.foot{flex-direction:column}}
  </style>
</head>
<body>
<script>window.BRAND={organizationName:"Finance Club PSTU",logoUrl:"https://raw.githubusercontent.com/SudiptoKumar/WORKSHOP-/refs/heads/main/assets/Finance-Club.jpg",verificationUrl:"https://financeclubpstu.vercel.app/verify"};window.AUTO_CERTIFICATE_ID="";</script>
<div class="wrap">
  <main class="card">
    <section class="hero">
      <div class="brand" id="brand"></div>
      <div class="eyebrow">Official verification</div>
      <h1>Certificate Verification</h1>
      <p class="sub">Verify an issued workshop certificate using its certificate ID.</p>
    </section>
    <section class="body">
      <label for="certificateId">Certificate ID</label>
      <div class="row">
        <input id="certificateId" autocomplete="off" placeholder="e.g. CERT-2026-00001">
        <button id="verifyBtn" onclick="verifyCertificate()">Verify Certificate</button>
      </div>
      <div class="hint">Enter the certificate ID exactly as shown on the certificate.</div>
      <div id="loading" class="loading">Checking certificate…</div>
      <div id="result" class="result"></div>
    </section>
    <footer class="foot"><span>Official certificate verification page</span><span id="orgFoot"></span></footer>
  </main>
</div>
<script>
function esc(v){return String(v??'').replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}
function renderBrand(){
  const b=window.BRAND||{}; const brand=document.getElementById('brand');
  if(b.logoUrl){brand.innerHTML='<img src="'+esc(b.logoUrl)+'" alt=""/><span>'+esc(b.organizationName||'WORKSHOP Automation')+'</span>';}
  else {const initials=String(b.organizationName||'WORKSHOP').split(/\s+/).filter(Boolean).slice(0,2).map(function(x){return x.charAt(0);}).join('');brand.innerHTML='<span class="brand-fallback">'+esc(initials)+'</span><span>'+esc(b.organizationName||'WORKSHOP Automation')+'</span>';}
  document.getElementById('orgFoot').textContent='© '+new Date().getFullYear()+' '+(b.organizationName||'WORKSHOP Automation');
}
function showResult(ok,data){
  const el=document.getElementById('result'); el.className='result '+(ok?'ok':'bad');
  if(!ok){el.innerHTML='<div class="status">Certificate not found</div><div>'+esc(data&&data.message?data.message:'No matching certificate was found.')+'</div>';}
  else {el.innerHTML='<div class="status">'+(data.isTest?'✓ Test certificate valid':'✓ Certificate valid')+'</div><dl><dt>Certificate ID</dt><dd>'+esc(data.certificateId)+'</dd><dt>Name</dt><dd>'+esc(data.name)+'</dd><dt>Workshop</dt><dd>'+esc(data.workshopName)+'</dd><dt>Event ID</dt><dd>'+esc(data.eventId)+'</dd><dt>Issue Date</dt><dd>'+esc(data.issueDate)+'</dd></dl>';}
  el.style.display='block';
}
function verifyCertificate(){
  const id=document.getElementById('certificateId').value.trim();
  if(!id){showResult(false,{message:'Please enter a certificate ID.'});return;}
  const btn=document.getElementById('verifyBtn');
  document.getElementById('result').style.display='none';
  document.getElementById('loading').style.display='block';
  btn.disabled=true;
  fetch('/api/verify-api?certificateId='+encodeURIComponent(id),{headers:{'Accept':'application/json'}})
    .then(async function(r){
      const text=await r.text();
      let data;
      try{data=JSON.parse(text);}catch(e){throw new Error('Verification service returned an invalid response.');}
      return {ok:r.ok,data:data};
    })
    .then(function(result){
      document.getElementById('loading').style.display='none';
      btn.disabled=false;
      if(result.data && result.data.code==='BACKEND_ERROR') {
        showResult(false,{message:result.data.message||'Verification service is temporarily unavailable.'});
        return;
      }
      showResult(!!(result.data&&result.data.valid),result.data||{});
    })
    .catch(function(err){
      document.getElementById('loading').style.display='none';
      btn.disabled=false;
      showResult(false,{message:'Verification service is temporarily unavailable. '+(err&&err.message?err.message:String(err))});
    });
}
document.getElementById('certificateId').addEventListener('keydown',function(e){if(e.key==='Enter')verifyCertificate();});
(function(){
  renderBrand();
  const q=new URLSearchParams(location.search);
  const pathMatch=location.pathname.match(/\/verify\/([^/?#]+)$/i);
  let id=window.AUTO_CERTIFICATE_ID||q.get('certificateId')||q.get('id')||((pathMatch&&pathMatch[1])?decodeURIComponent(pathMatch[1]):'');
  if(id){document.getElementById('certificateId').value=id;verifyCertificate();}
})();
</script>
</body>
</html>
